name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Set-Content -LiteralPath version.py -Value "APP_VERSION = `"$version`"" -Encoding UTF8

      - name: Build EXE
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm --distpath release --workpath build-release cache_clear.spec

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/cache_clear.exe --title "Cache Cleaner ${{ github.ref_name }}" --generate-notes
